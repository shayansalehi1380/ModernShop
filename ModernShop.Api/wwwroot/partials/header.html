<style>
@keyframes announcement-blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
.typing-cursor { display: inline-block; margin-inline-start: 1px; animation: announcement-blink 1s step-end infinite; }
</style>
<div class="w-full overflow-hidden bg-emerald px-4 py-1.5 text-center">
    <p class="mx-auto max-w-7xl truncate text-[11px] font-medium leading-tight text-white sm:text-xs">
        <span id="announcement-typing"></span><span class="typing-cursor" aria-hidden="true">|</span>
    </p>
</div>
<header class="sticky top-0 z-50 rounded-b-2xl bg-surface shadow-[0_1px_0_0_var(--line)] lg:shadow-[0_1px_0_0_var(--line),0_6px_16px_-4px_rgba(0,0,0,0.08)]">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
        <a href="home" class="flex items-center gap-2">
            <img src="images/logo_header.png" alt="Dorin Market" class="h-9 w-auto shrink-0"
                 draggable="false" oncontextmenu="return false"
                 style="-webkit-user-drag:none; -webkit-touch-callout:none; user-select:none; pointer-events:none;" />
        </a>
        <nav class="hidden items-center gap-7 lg:flex">
            <a href="home" data-nav-link class="text-sm text-foreground/75 hover-emerald">صفحه اصلی</a>
            <div class="group relative">
                <a href="shop" data-nav-link class="flex items-center gap-1 text-sm text-foreground/75 hover-emerald">
                    فروشگاه
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="transition-transform duration-150 group-hover:rotate-180"><path d="m6 9 6 6 6-6" /></svg>
                </a>
                <div class="invisible absolute right-0 top-full z-40 w-56 origin-top pt-2.5 opacity-0 scale-95 transition-all duration-150 ease-out group-hover:visible group-hover:scale-100 group-hover:opacity-100">
                    <div class="overflow-hidden rounded-2xl border border-emerald bg-surface p-1.5 shadow-lg">
                        <a href="shop?category=fashion" class="block rounded-xl px-4 py-2.5 text-sm text-foreground/85 transition hover:bg-emerald-soft hover:text-emerald">پوشاک</a>
                        <a href="shop?category=digital" class="block rounded-xl px-4 py-2.5 text-sm text-foreground/85 transition hover:bg-emerald-soft hover:text-emerald">دیجیتال</a>
                        <a href="shop?category=home-kitchen" class="block rounded-xl px-4 py-2.5 text-sm text-foreground/85 transition hover:bg-emerald-soft hover:text-emerald">خانه و آشپزخانه</a>
                        <a href="shop?category=beauty-health" class="block rounded-xl px-4 py-2.5 text-sm text-foreground/85 transition hover:bg-emerald-soft hover:text-emerald">زیبایی</a>
                    </div>
                </div>
            </div>
            <a href="blog" data-nav-link class="text-sm text-foreground/75 hover-emerald">وبلاگ</a>
        </nav>
        <div id="header-search-wrap" class="relative hidden flex-1 max-w-md lg:flex mx-3">
            <div class="flex w-full items-center gap-2.5 rounded-full border border-line bg-surface-muted px-5 py-3 transition focus-within:border-emerald">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-muted shrink-0"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
                <input id="header-search-input" type="text" placeholder="جستجوی کالا، برند..." class="w-full bg-transparent text-[15px] outline-none placeholder:text-muted" autocomplete="off" />
            </div>
            <div id="header-search-dropdown" class="hidden absolute right-0 top-[calc(100%+8px)] z-50 max-h-96 w-full min-w-[320px] overflow-y-auto rounded-2xl border border-line bg-surface py-1.5 shadow-lg"></div>
        </div>
        <div class="flex items-center gap-2">
            <div class="relative hidden lg:block">
                <button id="account-menu-btn" onclick="toggleAccountMenu(event)"
                        class="inline-flex items-center gap-2 rounded-full border border-line px-4 py-2.5 text-sm font-medium text-foreground hover:border-emerald hover:text-emerald">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><path d="M10 17l5-5-5-5" /><path d="M15 12H3" /></svg>
                    <span id="account-menu-label">ورود | ثبت‌نام</span>
                    <svg id="account-menu-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="m6 9 6 6 6-6" /></svg>
                </button>
                <div id="account-menu-dropdown" class="hidden absolute left-0 top-[calc(100%+8px)] z-50 w-56 overflow-hidden rounded-2xl border border-line bg-surface shadow-lg">
                    <a href="account" class="flex items-center gap-2.5 px-4 py-3 text-sm text-foreground hover:bg-surface-muted">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>
                        مدیریت حساب کاربری
                    </a>
                    <button onclick="handleHeaderLogout()" class="flex w-full items-center gap-2.5 border-t border-line px-4 py-3 text-sm text-danger hover:bg-surface-muted">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></svg>
                        خروج
                    </button>
                </div>
            </div>
            <a href="auth" data-auth-link data-auth-loggedin-text="حساب من" data-auth-loggedout-text="ورود"
               class="inline-flex items-center gap-1.5 rounded-full border border-line px-3 py-2 text-sm font-medium text-foreground hover:border-emerald hover:text-emerald lg:hidden">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /><path d="M10 17l5-5-5-5" /><path d="M15 12H3" /></svg>
                <span data-auth-label>ورود</span>
            </a>
            <a href="cart" class="relative hidden lg:inline-flex rounded-full p-2.5 text-foreground hover:bg-surface-muted" aria-label="سبد خرید">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" /></svg>
                <span data-cart-badge class="absolute -top-0.5 -left-0.5 flex h-4 w-4 items-center justify-center rounded-full bg-emerald text-[10px] font-bold text-white" style="display:none">0</span>
            </a>
        </div>
    </div>
</header>
